sonar.projectKey=spora-ai_spora-plugin-word
sonar.projectName=spora-plugin-word
sonar.projectVersion=0.1.0
sonar.organization=spora-ai

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.php.coverage.reportPaths=coverage/clover.xml
# Must match the `--log-junit=` path in .github/workflows/ci.yml. Inherited
# from spora-plugin-typst, where it points at a file that job never writes, so
# no test-execution data ever reaches SonarCloud there.
sonar.php.tests.reportPaths=coverage/junit.xml

sonar.coverage.exclusions=src/Exceptions/**
sonar.exclusions=vendor/**,coverage/**,tests/**

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-plugin-word

sonar.cpd.exclusions=src/**/*.php
