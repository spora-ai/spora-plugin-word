# One SonarCloud project per repository, and this file is the only thing that
# says which one. A *second* project for this repo — its key is this key with
# a `2` appended, and its name is the same `spora-plugin-word` — is not a
# misconfiguration of this file: it is SonarCloud's **Automatic analysis**
# (autoscan) running this repository from SonarCloud's own side. Autoscan
# provisions its own project and its own analysis config (`sonar.sources=.`,
# no test tree, `sonar.coverage.exclusions=**/*`) and never reads this file, so
# it analyses `tests/` as production code, reports findings the analysis below
# never would, ingests no coverage, and answers a `pullRequest=2` link that
# looks like the real one. It also duplicates every analysis, so the two
# dashboards disagree and only one of them has a quality gate anyone reads.
#
# The fix is on the SonarCloud side, not here: turn Automatic analysis off for
# `spora-ai/spora-plugin-word` and delete `spora-ai_spora-plugin-word2`. CI
# already scans every push and every PR below, so autoscan has nothing to add.
# If a `…2` twin ever reappears, that is what happened.
#
# **The key and the repository still say `word`, and that is deliberate.** The
# package was renamed to `spora-ai/spora-plugin-office`; the *GitHub
# repository* was not, and renaming it is the maintainer's step. The project
# key is derived from the repository, and `sonar.pullrequest.github.repository`
# has to name a repository that exists or the PR annotations go nowhere — so
# both move together, with the repository.
sonar.projectKey=spora-ai_spora-plugin-word
sonar.projectName=spora-plugin-word
sonar.organization=spora-ai

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.php.coverage.reportPaths=coverage/clover.xml
# `reportPath`, singular — the spelling the PHPUnit sensor actually reads, and
# the one it names when it finds nothing ("No PHPUnit tests reports provided
# (see 'sonar.php.tests.reportPath' property)"). The plural spelling this line
# used to carry is not read at all, so the JUnit XML the Pest job writes and
# this job downloads was silently dropped: the file was there, the sensor
# never looked. The path itself must match the `--log-junit=` path in
# .github/workflows/ci.yml. spora-plugin-typst names the same path, and its
# job writes the file.
sonar.php.tests.reportPath=coverage/junit.xml

sonar.coverage.exclusions=src/Exceptions/**
# `tests/**` is deliberately NOT excluded. Declaring `sonar.tests` and then
# excluding the same directory is a contradiction: the tree is announced as
# the test suite and then removed from the analysis, so its code smells
# never reach the PR that introduced them and the test-execution report
# above has nothing to attach to. spora-core, spora-plugin-staan,
# spora-plugin-media-archive and spora-plugin-typst all analyse their tests,
# and this is what it buys: the same finding the `…2` twin reported — a
# duplicated MIME literal, a generic exception in a fixture helper — now
# arrives on the PR that wrote it, where the review rules can act on it.
sonar.exclusions=vendor/**,coverage/**

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-plugin-word

sonar.cpd.exclusions=src/**/*.php
